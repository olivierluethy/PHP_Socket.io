<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>php-realtime — session demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Built against docs/STYLEGUIDE.md — TuneVote dark glassmorphism. */
      :root {
        --bg: #020617;            /* slate-950 */
        --surface: rgba(255,255,255,.05);
        --surface-2: rgba(255,255,255,.10);
        --border: rgba(255,255,255,.10);
        --text: #ffffff;
        --muted: rgba(255,255,255,.45);
        --purple: #8b5cf6;
        --pink: #ec4899;
        --green: #4ade80;
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: var(--text);
        font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(139,92,246,.18), transparent 60%),
          radial-gradient(1000px 500px at 0% 110%, rgba(236,72,153,.14), transparent 60%),
          var(--bg);
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--green); box-shadow: 0 0 12px rgba(74,222,128,.9); }
      h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
      .grad { background: linear-gradient(135deg, #c4b5fd, #f9a8d4 60%, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { color: var(--muted); margin: 4px 0 28px; }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
        padding: 22px; margin-bottom: 18px; backdrop-filter: blur(24px);
        box-shadow: 0 25px 50px -12px rgba(139,92,246,.20);
      }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input, textarea {
        font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 10px 12px; outline: none; transition: border-color .15s;
      }
      input::placeholder, textarea::placeholder { color: rgba(255,255,255,.3); }
      input:focus, textarea:focus { border-color: var(--purple); }
      input { flex: 1; min-width: 160px; }
      textarea { width: 100%; height: 96px; margin-top: 12px; resize: vertical; }
      button {
        font: inherit; font-weight: 600; color: #fff; cursor: pointer; border: 0;
        border-radius: 12px; padding: 10px 16px; background: linear-gradient(90deg, var(--purple), var(--pink));
        transition: box-shadow .15s, opacity .15s;
      }
      button:hover { box-shadow: 0 8px 24px rgba(139,92,246,.35); }
      button.ghost { background: var(--surface); border: 1px solid var(--border); }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 8px; }
      .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 12px; }
      .pill .dot { width: 7px; height: 7px; }
      code { color: #c4b5fd; background: rgba(196,181,253,.08); padding: 2px 6px; border-radius: 6px; }
      #log { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: rgba(255,255,255,.75);
             max-height: 220px; overflow: auto; font-family: ui-monospace, monospace; }
      .status { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span><h1><span class="grad">php-realtime</span> session demo</h1></div>
      <p class="sub">
        Real-time sessions over PHP + MySQL — no Node, no WebSocket daemon. Open in
        two tabs: create in one, join with the id in the other, type in the shared
        note. Changes sync via long-poll/SSE within ~1&nbsp;s.
      </p>

      <div class="card">
        <h2>Session</h2>
        <div class="row">
          <input id="name" placeholder="Your display name" />
          <button id="createBtn">Create</button>
        </div>
        <div class="row" style="margin-top:10px;">
          <input id="sessionId" placeholder="Session id" />
          <button id="joinBtn" class="ghost">Join</button>
        </div>
        <div class="meta">
          <span class="status" id="status">idle</span>
          <span class="pill"><span class="dot"></span><span id="viewers">0</span> live</span>
          <span class="status">v<span id="version">0</span></span>
          <span class="status" id="who"></span>
        </div>
      </div>

      <div class="card">
        <h2>Shared note</h2>
        <textarea id="note" placeholder="Shared state — synced to everyone in the session"></textarea>
      </div>

      <div class="card">
        <h2>Event log</h2>
        <pre id="log"></pre>
      </div>
    </div>

    <script src="/realtime-client.js"></script>
    <script src="client.js"></script>
  </body>
</html>
