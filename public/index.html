<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHP Socket — session demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      input, textarea { font: inherit; padding: 6px 8px; box-sizing: border-box; }
      textarea { width: 100%; height: 90px; margin-top: 10px; }
      .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
      button { padding: 6px 12px; cursor: pointer; }
      #log { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 6px; height: 160px; overflow: auto; font-size: 12px; }
      #participants { color: #555; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Shared session (long-poll, no Node)</h1>
    <p>Open this page in two tabs. Create a session in one, copy the id into the
      other and Join. Typing in the shared note syncs across tabs within ~1s.</p>

    <div class="row">
      <input id="name" placeholder="Your name" />
      <button id="createBtn">Create session</button>
    </div>
    <div class="row">
      <input id="sessionId" placeholder="Session id" size="30" />
      <button id="joinBtn">Join</button>
    </div>

    <div id="participants">Participants: —</div>
    <textarea id="note" placeholder="Shared note (synced to everyone)"></textarea>

    <h3>Event log</h3>
    <div id="log"></div>

    <script src="client.js"></script>
  </body>
</html>
